<svg width="680" height="350" viewBox="0 0 680 350" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Decision: given a link, when OBO applies versus browser or cite</title>
<desc>Starting from a link, resolve the host against an integration registry. If the host exposes a token-accepting API registered with the IdP, use OBO to fetch as the user. If it is a cookie-only web page, use a per-user browser session or cite the link. Unknown hosts are cited and flagged for onboarding.</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#888780"/></marker></defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5;marker-end:url(#arrow)}
.box{fill:#FBFAF7;stroke:#888780;stroke-width:0.6}
.node{cursor:pointer}
.leader{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:2 2}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.6}
.c-gray .t,.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.6}
.c-purple .t,.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.6}
.c-teal .t,.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.6}
.c-amber .t,.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse{fill:#FAECE7;stroke:#993C1D;stroke-width:0.6}
.c-coral .t,.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-green>rect,.c-green>circle,.c-green>ellipse{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.6}
.c-green .t,.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-blue>rect,.c-blue>circle,.c-blue>ellipse{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.6}
.c-blue .t,.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-red>rect,.c-red>circle,.c-red>ellipse{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.6}
.c-red .t,.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
.c-pink>rect,.c-pink>circle,.c-pink>ellipse{fill:#FBEAF0;stroke:#993556;stroke-width:0.6}
.c-pink .t,.c-pink .th{fill:#72243E}.c-pink .ts{fill:#993556}
</style>
<rect x="0" y="0" width="680" height="350" fill="#ffffff"/>
<line x1="340" y1="74" x2="340" y2="90" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="340" y1="132" x2="340" y2="150" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<text class="ts" x="352" y="146" text-anchor="start">yes → token resource</text>
<line x1="250" y1="182" x2="150" y2="214" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="430" y1="182" x2="545" y2="214" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<text class="ts" x="150" y="205" text-anchor="middle">cookie-only</text>
<text class="ts" x="560" y="205" text-anchor="middle">unknown host</text>
<line x1="150" y1="270" x2="150" y2="288" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>

<g class="c-gray"><rect x="240" y="42" width="200" height="32" rx="8"/><text class="t" x="340" y="62" text-anchor="middle">a link (host + path)</text></g>
<g class="c-gray"><rect x="200" y="90" width="280" height="42" rx="8"/><text class="t" x="340" y="109" text-anchor="middle">resolve host → integration registry</text><text class="ts" x="340" y="124" text-anchor="middle">token-accepting API behind it?</text></g>

<g class="c-green"><rect x="215" y="150" width="250" height="46" rx="8"/><text class="t" x="340" y="170" text-anchor="middle">OBO → fetch as user via API ✅</text><text class="ts" x="340" y="185" text-anchor="middle">OAuth is exactly right (Solution A)</text></g>

<g class="c-coral"><rect x="40" y="214" width="220" height="54" rx="8"/><text class="t" x="150" y="234" text-anchor="middle">cookie-only web page</text><text class="ts" x="150" y="250" text-anchor="middle">OBO can't help — need the</text><text class="ts" x="150" y="263" text-anchor="middle">user's session</text></g>
<g class="c-amber"><rect x="440" y="214" width="210" height="54" rx="8"/><text class="t" x="545" y="234" text-anchor="middle">cite the link (Solution D)</text><text class="ts" x="545" y="250" text-anchor="middle">safe default · flag host</text><text class="ts" x="545" y="263" text-anchor="middle">for onboarding</text></g>

<g class="c-teal"><rect x="40" y="288" width="220" height="46" rx="8"/><text class="t" x="150" y="308" text-anchor="middle">per-user browser (B)</text><text class="ts" x="150" y="323" text-anchor="middle">or cite (D)</text></g>
</svg>