<svg width="680" height="384" viewBox="0 0 680 384" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Web service delegated identity (OBO) auth flow</title>
<desc>The user does SSO login to the service; the service authenticates via the identity provider, receives the user's token, exchanges it on-behalf-of for a downstream token scoped as the user, calls the platform API with that token, and the platform enforces the user's RBAC before returning authorized content.</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#888780"/></marker></defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5;marker-end:url(#arrow)}
.box{fill:#FBFAF7;stroke:#888780;stroke-width:0.6}
.node{cursor:pointer}
.leader{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:2 2}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.6}
.c-gray .t,.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.6}
.c-purple .t,.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.6}
.c-teal .t,.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.6}
.c-amber .t,.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse{fill:#FAECE7;stroke:#993C1D;stroke-width:0.6}
.c-coral .t,.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-green>rect,.c-green>circle,.c-green>ellipse{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.6}
.c-green .t,.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-blue>rect,.c-blue>circle,.c-blue>ellipse{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.6}
.c-blue .t,.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-red>rect,.c-red>circle,.c-red>ellipse{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.6}
.c-red .t,.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
.c-pink>rect,.c-pink>circle,.c-pink>ellipse{fill:#FBEAF0;stroke:#993556;stroke-width:0.6}
.c-pink .t,.c-pink .th{fill:#72243E}.c-pink .ts{fill:#993556}
</style>
<rect x="0" y="0" width="680" height="384" fill="#ffffff"/>
<line x1="90" y1="70" x2="90" y2="368" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="270" y1="70" x2="270" y2="368" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="450" y1="70" x2="450" y2="368" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="615" y1="70" x2="615" y2="368" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="3 3"/>
<g class="c-gray"><rect x="18" y="36" width="144" height="32" rx="8"/><text class="t" x="90" y="56" text-anchor="middle">User</text></g>
<g class="c-purple"><rect x="196" y="36" width="148" height="32" rx="8"/><text class="t" x="270" y="56" text-anchor="middle">Service (Columbo)</text></g>
<g class="c-blue"><rect x="382" y="36" width="136" height="32" rx="8"/><text class="t" x="450" y="56" text-anchor="middle">Identity platform</text></g>
<g class="c-teal"><rect x="552" y="36" width="124" height="32" rx="8"/><text class="t" x="614" y="56" text-anchor="middle">Platform API</text></g>
<line x1="90" y1="100" x2="270" y2="100" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="180" y="94" text-anchor="middle">① SSO login</text>
<line x1="270" y1="128" x2="450" y2="128" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="360" y="122" text-anchor="middle">② authenticate (OIDC)</text>
<line x1="450" y1="156" x2="270" y2="156" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="360" y="150" text-anchor="middle">③ user token</text>
<line x1="270" y1="184" x2="450" y2="184" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="360" y="178" text-anchor="middle">④ token exchange (OBO): AS you</text>
<line x1="450" y1="212" x2="270" y2="212" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="360" y="206" text-anchor="middle">⑤ downstream token · sub = you</text>
<line x1="270" y1="240" x2="615" y2="240" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="440" y="234" text-anchor="middle">⑥ API call with YOUR token</text>
<g class="c-green"><rect x="520" y="258" width="156" height="28" rx="8"/><text class="ts" x="598" y="276" text-anchor="middle">⑦ platform enforces YOUR RBAC ✅</text></g>
<line x1="615" y1="308" x2="270" y2="308" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="440" y="302" text-anchor="middle">⑧ authorized content</text>
<line x1="270" y1="340" x2="90" y2="340" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="180" y="334" text-anchor="middle">⑨ cited answer</text>
</svg>