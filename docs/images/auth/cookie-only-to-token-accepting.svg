<svg width="680" height="336" viewBox="0 0 680 336" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Cookie-only versus token-accepting request pipeline</title>
<desc>Two request pipelines. Cookie-only: credential cookie, session lookup to identity, authorize with RBAC and ACL, respond HTML. Token-accepting: credential bearer JWT, validate JWT which is the only new step, authorize with the same RBAC and ACL which is reused, respond JSON which is changed. Identity resolution and authorization are shared; the IdP one-time registers the app as an OAuth resource with scopes.</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#888780"/></marker></defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5;marker-end:url(#arrow)}
.box{fill:#FBFAF7;stroke:#888780;stroke-width:0.6}
.node{cursor:pointer}
.leader{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:2 2}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.6}
.c-gray .t,.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.6}
.c-purple .t,.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.6}
.c-teal .t,.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.6}
.c-amber .t,.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse{fill:#FAECE7;stroke:#993C1D;stroke-width:0.6}
.c-coral .t,.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-green>rect,.c-green>circle,.c-green>ellipse{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.6}
.c-green .t,.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-blue>rect,.c-blue>circle,.c-blue>ellipse{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.6}
.c-blue .t,.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-red>rect,.c-red>circle,.c-red>ellipse{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.6}
.c-red .t,.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
.c-pink>rect,.c-pink>circle,.c-pink>ellipse{fill:#FBEAF0;stroke:#993556;stroke-width:0.6}
.c-pink .t,.c-pink .th{fill:#72243E}.c-pink .ts{fill:#993556}
</style>
<rect x="0" y="0" width="680" height="336" fill="#ffffff"/>
<g class="c-blue"><rect x="20" y="40" width="640" height="26" rx="8"/><text class="ts" x="340" y="57" text-anchor="middle">IdP (one-time): register the app as an OAuth resource + define scopes → now tokens have an audience to target</text></g>

<line x1="175" y1="112" x2="185" y2="112" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="340" y1="112" x2="350" y2="112" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="505" y1="112" x2="515" y2="112" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="175" y1="238" x2="185" y2="238" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="340" y1="238" x2="350" y2="238" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="505" y1="238" x2="515" y2="238" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>

<text class="ts" x="20" y="92" text-anchor="start">cookie-only (before)</text>
<g class="c-coral"><rect x="20" y="96" width="155" height="34" rx="8"/><text class="ts" x="97" y="117" text-anchor="middle">credential: cookie</text></g>
<g class="c-gray"><rect x="185" y="96" width="155" height="34" rx="8"/><text class="ts" x="262" y="112" text-anchor="middle">session lookup</text><text class="ts" x="262" y="125" text-anchor="middle">→ identity</text></g>
<g class="c-green"><rect x="350" y="96" width="155" height="34" rx="8"/><text class="ts" x="427" y="117" text-anchor="middle">authorize: RBAC + ACL</text></g>
<g class="c-coral"><rect x="515" y="96" width="145" height="34" rx="8"/><text class="ts" x="587" y="117" text-anchor="middle">respond: HTML</text></g>

<text class="ts" x="20" y="218" text-anchor="start">token-accepting (after)</text>
<g class="c-teal"><rect x="20" y="222" width="155" height="34" rx="8"/><text class="ts" x="97" y="243" text-anchor="middle">credential: Bearer JWT</text></g>
<g class="c-amber"><rect x="185" y="222" width="155" height="34" rx="8"/><text class="ts" x="262" y="238" text-anchor="middle">validate JWT ✚ NEW</text><text class="ts" x="262" y="251" text-anchor="middle">→ identity</text></g>
<g class="c-green"><rect x="350" y="222" width="155" height="34" rx="8"/><text class="ts" x="427" y="243" text-anchor="middle">authorize: RBAC + ACL</text></g>
<g class="c-teal"><rect x="515" y="222" width="145" height="34" rx="8"/><text class="ts" x="587" y="243" text-anchor="middle">respond: JSON ↺ CHANGED</text></g>

<line x1="427" y1="130" x2="427" y2="222" stroke="#1D9E75" stroke-width="1.4" stroke-dasharray="4 3"/>
<g class="c-green"><rect x="360" y="166" width="135" height="20" rx="8"/><text class="ts" x="427" y="180" text-anchor="middle">reused unchanged</text></g>

<text class="ts" x="20" y="300" text-anchor="start">Identity-resolution + authorization are shared — do NOT fork them. The only genuinely new code is token validation;</text>
<text class="ts" x="20" y="318" text-anchor="start">the representation changes HTML→JSON. Cost scales with how tangled steps 3–4 are with HTML rendering today.</text>
</svg>