<svg width="680" height="372" viewBox="0 0 680 372" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SSO login flow via an identity provider</title>
<desc>The browser requests a protected page, the app redirects to the IdP, the browser follows carrying any existing IdP session cookie; first time the IdP prompts login and MFA, otherwise it skips straight through which is single sign-on; the IdP redirects back with a signed token, the app verifies the IdP signature, sets its own session cookie, and serves the page.</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#888780"/></marker></defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5;marker-end:url(#arrow)}
.box{fill:#FBFAF7;stroke:#888780;stroke-width:0.6}
.node{cursor:pointer}
.leader{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:2 2}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.6}
.c-gray .t,.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.6}
.c-purple .t,.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.6}
.c-teal .t,.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.6}
.c-amber .t,.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse{fill:#FAECE7;stroke:#993C1D;stroke-width:0.6}
.c-coral .t,.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-green>rect,.c-green>circle,.c-green>ellipse{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.6}
.c-green .t,.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-blue>rect,.c-blue>circle,.c-blue>ellipse{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.6}
.c-blue .t,.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-red>rect,.c-red>circle,.c-red>ellipse{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.6}
.c-red .t,.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
.c-pink>rect,.c-pink>circle,.c-pink>ellipse{fill:#FBEAF0;stroke:#993556;stroke-width:0.6}
.c-pink .t,.c-pink .th{fill:#72243E}.c-pink .ts{fill:#993556}
</style>
<rect x="0" y="0" width="680" height="372" fill="#ffffff"/>
<line x1="120" y1="70" x2="120" y2="356" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="340" y1="70" x2="340" y2="356" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="560" y1="70" x2="560" y2="356" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="3 3"/>
<g class="c-gray"><rect x="50" y="36" width="140" height="32" rx="8"/><text class="t" x="120" y="56" text-anchor="middle">Browser (You)</text></g>
<g class="c-purple"><rect x="270" y="36" width="140" height="32" rx="8"/><text class="t" x="340" y="56" text-anchor="middle">App (RP / SP)</text></g>
<g class="c-blue"><rect x="490" y="36" width="140" height="32" rx="8"/><text class="t" x="560" y="56" text-anchor="middle">IdP</text></g>
<line x1="120" y1="100" x2="340" y2="100" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="230" y="94" text-anchor="middle">① GET /page (no session)</text>
<line x1="340" y1="132" x2="120" y2="132" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="230" y="126" text-anchor="middle">② 302 redirect → IdP (authn request)</text>
<line x1="120" y1="164" x2="560" y2="164" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="330" y="158" text-anchor="middle">③ follow redirect (+ IdP session cookie, if any)</text>
<g class="c-amber"><rect x="404" y="180" width="256" height="34" rx="8"/><text class="ts" x="532" y="194" text-anchor="middle">④ first time: login + MFA</text><text class="ts" x="532" y="208" text-anchor="middle">already signed in: skip → this is SSO</text></g>
<line x1="560" y1="240" x2="120" y2="240" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="330" y="234" text-anchor="middle">⑤ redirect back + signed token / assertion</text>
<line x1="120" y1="272" x2="340" y2="272" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="230" y="266" text-anchor="middle">⑥ deliver token · verify IdP signature</text>
<line x1="340" y1="304" x2="120" y2="304" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="230" y="298" text-anchor="middle">⑦ set app session cookie · serve page</text>
<g class="c-green"><rect x="60" y="322" width="560" height="26" rx="8"/><text class="ts" x="340" y="339" text-anchor="middle">trust = the IdP's signature · the app never sees your password · the IdP session (③) is what makes the next app instant</text></g>
</svg>