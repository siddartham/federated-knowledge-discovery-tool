<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 300" role="img">
<title>Match the auth flow to where the code runs and what it touches</title>
<desc>Two axes decide the auth approach: whether the code runs on the user's machine or a shared server, and whether it touches a token-accepting API or a cookie-only web page.</desc>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.c-green>rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:.6}.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.6}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.6}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D;stroke-width:.6}.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
</style>
<rect x="0" y="0" width="680" height="300" fill="#ffffff"/>

<text class="ts" x="240" y="34" text-anchor="middle">touches a token-accepting API</text>
<text class="ts" x="500" y="34" text-anchor="middle">touches a cookie-only web page</text>
<text class="th" x="80" y="96" text-anchor="middle" transform="rotate(-90 80 96)">user's machine</text>
<text class="th" x="80" y="210" text-anchor="middle" transform="rotate(-90 80 210)">shared server</text>

<g class="c-green"><rect x="120" y="46" width="240" height="86" rx="8"/><text class="th" x="240" y="76" text-anchor="middle">desktop app</text><text class="ts" x="240" y="98" text-anchor="middle">use the user's own session</text><text class="ts" x="240" y="116" text-anchor="middle">&amp; credentials — simplest</text></g>
<g class="c-green"><rect x="380" y="46" width="240" height="86" rx="8"/><text class="th" x="500" y="76" text-anchor="middle">desktop app</text><text class="ts" x="500" y="98" text-anchor="middle">the logged-in browser</text><text class="ts" x="500" y="116" text-anchor="middle">already has the cookies</text></g>
<g class="c-teal"><rect x="120" y="160" width="240" height="86" rx="8"/><text class="th" x="240" y="190" text-anchor="middle">delegated identity (OBO)</text><text class="ts" x="240" y="212" text-anchor="middle">exchange the user's token;</text><text class="ts" x="240" y="230" text-anchor="middle">the API enforces their RBAC</text></g>
<g class="c-amber"><rect x="380" y="160" width="240" height="86" rx="8"/><text class="th" x="500" y="186" text-anchor="middle">per-user browser, or cite</text><text class="ts" x="500" y="208" text-anchor="middle">no token exists to delegate —</text><text class="ts" x="500" y="226" text-anchor="middle">host a session, or link, don't fetch</text></g>

<g class="c-red"><rect x="120" y="262" width="500" height="30" rx="8"/><text class="ts" x="370" y="281" text-anchor="middle">✗ never: one shared service account for all users — it flattens everyone's permissions into one</text></g>
</svg>
