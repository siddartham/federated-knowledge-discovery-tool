<svg width="680" height="322" viewBox="0 0 680 322" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Web service cite-don't-fetch auth flow</title>
<desc>The service answers from APIs fetched as the user, and when it hits an SSO web link with no API it does not fetch it but cites the link; the user opens the link in their own browser, where the resource enforces the user's RBAC. Safe but the linked content is not read for the user.</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#888780"/></marker></defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5;marker-end:url(#arrow)}
.box{fill:#FBFAF7;stroke:#888780;stroke-width:0.6}
.node{cursor:pointer}
.leader{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:2 2}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.6}
.c-gray .t,.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.6}
.c-purple .t,.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.6}
.c-teal .t,.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.6}
.c-amber .t,.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse{fill:#FAECE7;stroke:#993C1D;stroke-width:0.6}
.c-coral .t,.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-green>rect,.c-green>circle,.c-green>ellipse{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.6}
.c-green .t,.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-blue>rect,.c-blue>circle,.c-blue>ellipse{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.6}
.c-blue .t,.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-red>rect,.c-red>circle,.c-red>ellipse{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.6}
.c-red .t,.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
.c-pink>rect,.c-pink>circle,.c-pink>ellipse{fill:#FBEAF0;stroke:#993556;stroke-width:0.6}
.c-pink .t,.c-pink .th{fill:#72243E}.c-pink .ts{fill:#993556}
</style>
<rect x="0" y="0" width="680" height="322" fill="#ffffff"/>
<line x1="120" y1="70" x2="120" y2="300" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="340" y1="70" x2="340" y2="300" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="560" y1="70" x2="560" y2="300" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="3 3"/>
<g class="c-gray"><rect x="50" y="36" width="140" height="32" rx="8"/><text class="t" x="120" y="56" text-anchor="middle">User</text></g>
<g class="c-purple"><rect x="270" y="36" width="140" height="32" rx="8"/><text class="t" x="340" y="56" text-anchor="middle">Service (Dossier)</text></g>
<g class="c-teal"><rect x="490" y="36" width="140" height="32" rx="8"/><text class="t" x="560" y="56" text-anchor="middle">Web platform</text></g>
<line x1="120" y1="100" x2="340" y2="100" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="230" y="94" text-anchor="middle">① question</text>
<g class="c-gray"><rect x="214" y="114" width="252" height="40" rx="8"/><text class="ts" x="340" y="131" text-anchor="middle">② APIs fetched AS you (Solution A);</text><text class="ts" x="340" y="146" text-anchor="middle">hit SSO web link with no API →</text></g>
<line x1="340" y1="176" x2="120" y2="176" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="230" y="170" text-anchor="middle">③ answer + CITE link (not fetched)</text>
<line x1="120" y1="212" x2="560" y2="212" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/><text class="ts" x="330" y="206" text-anchor="middle">④ you open the link yourself</text>
<g class="c-green"><rect x="470" y="230" width="188" height="28" rx="8"/><text class="ts" x="564" y="248" text-anchor="middle">⑤ your browser → YOUR RBAC ✅</text></g>
<text class="ts" x="40" y="292" text-anchor="start">Zero leak risk, trivial — but the linked content isn't read for you (degraded completeness).</text>
</svg>