<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 372" role="img">
<title>Why an agent needs guardrails: untrusted influence reaches real power through a model that can't tell data from instructions</title>
<desc>Untrusted inputs on the left flow through the agent in the middle to real power on the right; danger is the product of untrusted influence and power.</desc>
<defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.6}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.6}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.6}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.6}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
</style>
<rect x="0" y="0" width="680" height="372" fill="#ffffff"/>

<text class="ts" x="340" y="38" text-anchor="middle">untrusted influence reaches real power</text>
<line x1="40" y1="52" x2="634" y2="52" stroke="#D85A30" stroke-width="3" marker-end="url(#arw)"/>

<rect x="24" y="70" width="196" height="200" rx="10" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
<text class="th" x="122" y="90" text-anchor="middle">untrusted input</text>
<g class="c-coral"><rect x="36" y="100" width="172" height="42" rx="6"/><text class="th" x="122" y="119" text-anchor="middle">the question</text><text class="ts" x="122" y="134" text-anchor="middle">from the user</text></g>
<g class="c-coral"><rect x="36" y="152" width="172" height="106" rx="6"/><text class="th" x="122" y="174" text-anchor="middle">retrieved content</text><text class="ts" x="122" y="196" text-anchor="middle">Slack · Confluence · tools</text><text class="ts" x="122" y="230" text-anchor="middle">anyone can write here</text></g>

<rect x="242" y="70" width="196" height="200" rx="10" fill="none" stroke="#7F77DD" stroke-width="1" stroke-dasharray="5 4"/>
<text class="th" x="340" y="90" text-anchor="middle">the agent (LLM)</text>
<g class="c-purple"><rect x="254" y="100" width="172" height="158" rx="6"/><text class="th" x="340" y="126" text-anchor="middle">no sense of trust</text><text class="ts" x="340" y="152" text-anchor="middle">it reads every string —</text><text class="ts" x="340" y="172" text-anchor="middle">your question, a Slack post,</text><text class="ts" x="340" y="192" text-anchor="middle">a tool's reply — as text it</text><text class="ts" x="340" y="212" text-anchor="middle">might be told to obey</text></g>

<rect x="460" y="70" width="196" height="200" rx="10" fill="none" stroke="#BA7517" stroke-width="1" stroke-dasharray="5 4"/>
<text class="th" x="558" y="90" text-anchor="middle">real power</text>
<g class="c-amber"><rect x="472" y="100" width="172" height="34" rx="6"/><text class="th" x="558" y="121" text-anchor="middle">fetch any URL</text></g>
<g class="c-amber"><rect x="472" y="138" width="172" height="34" rx="6"/><text class="th" x="558" y="159" text-anchor="middle">call tools / MCP</text></g>
<g class="c-amber"><rect x="472" y="176" width="172" height="34" rx="6"/><text class="th" x="558" y="197" text-anchor="middle">cross-user data + cache</text></g>
<g class="c-amber"><rect x="472" y="214" width="172" height="34" rx="6"/><text class="th" x="558" y="235" text-anchor="middle">the answer users trust</text></g>

<line x1="220" y1="176" x2="242" y2="176" stroke="#D85A30" stroke-width="2" marker-end="url(#arw)"/>
<line x1="438" y1="176" x2="460" y2="176" stroke="#D85A30" stroke-width="2" marker-end="url(#arw)"/>

<g class="c-gray"><rect x="24" y="286" width="632" height="66" rx="10"/><text class="th" x="40" y="310" text-anchor="start">Danger = untrusted influence × power.</text><text class="ts" x="40" y="330" text-anchor="start">You can't zero either — you need input, and you need it to act. So you place a check wherever</text><text class="ts" x="40" y="346" text-anchor="start">untrusted becomes powerful. That check is a guardrail.</text></g>
</svg>
