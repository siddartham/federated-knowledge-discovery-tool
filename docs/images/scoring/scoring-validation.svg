<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 356" role="img">
<title>Three experiments that validate the scoring design against logged runs</title>
<desc>From run logs and evals: check dimension decorrelation with a correlation matrix, confidence calibration with a reliability curve, and scorer precision against what synthesis actually cited.</desc>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.tsm{font-size:11px;fill:#5F5E5A}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.6}.c-gray .th{fill:#444441}.c-gray .ts,.c-gray .tsm{fill:#5F5E5A}
</style>
<rect x="0" y="0" width="680" height="356" fill="#ffffff"/>

<g class="c-gray"><rect x="24" y="24" width="632" height="40" rx="8"/><text class="ts" x="340" y="42" text-anchor="middle">inputs: run.jsonl (per-iteration confidence · per-result scores) · faithfulness evals · which evidence Opus cited</text><text class="tsm" x="340" y="57" text-anchor="middle">step 0 (done) — the run log now carries the four score dims and four confidence dims per event</text></g>

<rect x="24" y="86" width="200" height="212" rx="10" fill="none" stroke="#185FA5" stroke-width="1"/>
<text class="th" x="124" y="108" text-anchor="middle" fill="#0C447C">1 · are the dims independent?</text>
<g transform="translate(70,120)">
<rect x="0" y="0" width="17" height="17" fill="#5DCAA5"/><rect x="19" y="0" width="17" height="17" fill="#FAC775"/><rect x="38" y="0" width="17" height="17" fill="#EDE9DE"/><rect x="57" y="0" width="17" height="17" fill="#EDE9DE"/>
<rect x="0" y="19" width="17" height="17" fill="#FAC775"/><rect x="19" y="19" width="17" height="17" fill="#5DCAA5"/><rect x="38" y="19" width="17" height="17" fill="#EDE9DE"/><rect x="57" y="19" width="17" height="17" fill="#EDE9DE"/>
<rect x="0" y="38" width="17" height="17" fill="#EDE9DE"/><rect x="19" y="38" width="17" height="17" fill="#EDE9DE"/><rect x="38" y="38" width="17" height="17" fill="#5DCAA5"/><rect x="57" y="38" width="17" height="17" fill="#EDE9DE"/>
<rect x="0" y="57" width="17" height="17" fill="#EDE9DE"/><rect x="19" y="57" width="17" height="17" fill="#EDE9DE"/><rect x="38" y="57" width="17" height="17" fill="#EDE9DE"/><rect x="57" y="57" width="17" height="17" fill="#5DCAA5"/>
</g>
<text class="tsm" x="124" y="212" text-anchor="middle">4×4 score-dim correlation</text>
<text class="tsm" x="124" y="234" text-anchor="middle">amber = a pair that moves</text>
<text class="tsm" x="124" y="248" text-anchor="middle">together (double-counting)</text>
<text class="tsm" x="124" y="278" text-anchor="middle">→ merge or down-weight it</text>

<rect x="240" y="86" width="200" height="212" rx="10" fill="none" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="340" y="108" text-anchor="middle" fill="#3C3489">2 · does 0.8 mean "good"?</text>
<g transform="translate(280,124)">
<line x1="0" y1="64" x2="0" y2="0" stroke="#888780" stroke-width="1"/><line x1="0" y1="64" x2="120" y2="64" stroke="#888780" stroke-width="1"/>
<line x1="0" y1="64" x2="120" y2="0" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M0 64 Q70 60 120 26" fill="none" stroke="#534AB7" stroke-width="1.6"/>
<line x1="88" y1="0" x2="88" y2="64" stroke="#3B6D11" stroke-width="1" stroke-dasharray="3 2"/>
</g>
<text class="tsm" x="340" y="212" text-anchor="middle">confidence → vs. quality ↑</text>
<text class="tsm" x="340" y="234" text-anchor="middle">dashed = honest; the curve</text>
<text class="tsm" x="340" y="248" text-anchor="middle">sagging = overconfident</text>
<text class="tsm" x="340" y="278" text-anchor="middle">→ move the cutoff / fix rubric</text>

<rect x="456" y="86" width="200" height="212" rx="10" fill="none" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="556" y="108" text-anchor="middle" fill="#085041">3 · does score predict citation?</text>
<g transform="translate(486,122)" font-size="11">
<text x="34" y="-2" text-anchor="middle" fill="#5F5E5A" font-size="10">scored</text><text x="150" y="-2" text-anchor="middle" fill="#5F5E5A" font-size="10">cited by Opus</text>
<rect x="0" y="6" width="68" height="18" rx="4" fill="#E1F5EE" stroke="#5DCAA5"/><text x="34" y="19" text-anchor="middle" fill="#085041">#1 (0.9)</text>
<rect x="0" y="30" width="68" height="18" rx="4" fill="#E1F5EE" stroke="#5DCAA5"/><text x="34" y="43" text-anchor="middle" fill="#085041">#2 (0.8)</text>
<rect x="0" y="54" width="68" height="18" rx="4" fill="#F1EFE8" stroke="#B4B2A9"/><text x="34" y="67" text-anchor="middle" fill="#5F5E5A">#7 (0.3)</text>
<rect x="116" y="6" width="18" height="18" rx="4" fill="#EAF3DE" stroke="#97C459"/><text x="125" y="19" text-anchor="middle" fill="#27500A">✓</text>
<rect x="116" y="54" width="18" height="18" rx="4" fill="#FCEBEB" stroke="#F09595"/><text x="125" y="67" text-anchor="middle" fill="#791F1F">!</text>
<line x1="68" y1="15" x2="116" y2="15" stroke="#888780" stroke-width="1"/>
<line x1="68" y1="63" x2="116" y2="63" stroke="#A32D2D" stroke-width="1" stroke-dasharray="3 2"/>
</g>
<text class="tsm" x="556" y="212" text-anchor="middle">scorer rank vs. what was cited</text>
<text class="tsm" x="556" y="234" text-anchor="middle">a citation from a low score =</text>
<text class="tsm" x="556" y="248" text-anchor="middle">the proxy mis-ranked</text>
<text class="tsm" x="556" y="278" text-anchor="middle">→ fix the scorer</text>

<text class="tsm" x="340" y="332" text-anchor="middle">each check turns a design claim into a measurement — and each failure mode has a concrete, bounded fix</text>
</svg>
