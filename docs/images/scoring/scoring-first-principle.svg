<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 184" role="img">
<title>Turning a fuzzy judgment into a number: decompose, grade on a coarse scale, average, normalize, threshold</title>
<desc>A fuzzy "is this good?" question is decomposed into orthogonal dimensions, each graded on a coarse Fibonacci scale, averaged, normalized to zero-to-one, and compared to a threshold to decide.</desc>
<defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.6}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-blue>rect{fill:#E6F1FB;stroke:#185FA5;stroke-width:.6}.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.6}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-green>rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:.6}.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
</style>
<rect x="0" y="0" width="680" height="184" fill="#ffffff"/>

<g class="c-gray"><rect x="14" y="56" width="124" height="60" rx="6"/><text class="th" x="76" y="82" text-anchor="middle">fuzzy question</text><text class="ts" x="76" y="100" text-anchor="middle">"is this good?"</text></g>
<g class="c-blue"><rect x="146" y="56" width="124" height="60" rx="6"/><text class="th" x="208" y="82" text-anchor="middle">decompose</text><text class="ts" x="208" y="100" text-anchor="middle">K orthogonal dims</text></g>
<g class="c-blue"><rect x="278" y="56" width="124" height="60" rx="6"/><text class="th" x="340" y="82" text-anchor="middle">grade each</text><text class="ts" x="340" y="100" text-anchor="middle">0·1·2·3·5·8·13</text></g>
<g class="c-purple"><rect x="410" y="56" width="124" height="60" rx="6"/><text class="th" x="472" y="82" text-anchor="middle">aggregate</text><text class="ts" x="472" y="100" text-anchor="middle">equal mean → [0,1]</text></g>
<g class="c-green"><rect x="542" y="56" width="124" height="60" rx="6"/><text class="th" x="604" y="82" text-anchor="middle">decide</text><text class="ts" x="604" y="100" text-anchor="middle">threshold → act</text></g>

<line class="arr" x1="138" y1="86" x2="146" y2="86"/>
<line class="arr" x1="270" y1="86" x2="278" y2="86"/>
<line class="arr" x1="402" y1="86" x2="410" y2="86"/>
<line class="arr" x1="534" y1="86" x2="542" y2="86"/>

<text class="ts" x="340" y="150" text-anchor="middle">the same recipe runs twice — once to ask "are we done?" and once to ask "is this evidence good?"</text>
</svg>
