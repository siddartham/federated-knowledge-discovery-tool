<svg width="680" height="560" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Registry.search dispatching to per-source native query builders</title>
<desc>Registry.search checks the search cache, lazily initializes the source, then dispatches by source key to one of six sources, each translating the query into its own native language and endpoint (GitHub code/issues qualifiers, Slack search modifiers, Confluence CQL, Jira JQL, Drive fullText), maps the payload to a list of Result, writes the search cache, and returns.</desc>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888780"/></marker>
</defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5;marker-end:url(#arrow)}
.box{fill:#FBFAF7;stroke:#888780;stroke-width:0.6}
.node{cursor:pointer}
.leader{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:2 2}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.6}
.c-gray .t,.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.6}
.c-purple .t,.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.6}
.c-teal .t,.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.6}
.c-amber .t,.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse{fill:#FAECE7;stroke:#993C1D;stroke-width:0.6}
.c-coral .t,.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-green>rect,.c-green>circle,.c-green>ellipse{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.6}
.c-green .t,.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-blue>rect,.c-blue>circle,.c-blue>ellipse{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.6}
.c-blue .t,.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-red>rect,.c-red>circle,.c-red>ellipse{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.6}
.c-red .t,.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
.c-pink>rect,.c-pink>circle,.c-pink>ellipse{fill:#FBEAF0;stroke:#993556;stroke-width:0.6}
.c-pink .t,.c-pink .th{fill:#72243E}.c-pink .ts{fill:#993556}
</style>
<rect x="0" y="0" width="680" height="560" fill="#ffffff"/>

<line x1="340" y1="80" x2="340" y2="96" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="340" y1="128" x2="340" y2="160" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="435" y1="112" x2="470" y2="112" stroke="#888780" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<line x1="340" y1="196" x2="340" y2="222" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="340" y1="382" x2="340" y2="398" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="340" y1="432" x2="340" y2="452" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="340" y1="486" x2="340" y2="506" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>

<g class="c-gray"><rect x="200" y="44" width="280" height="36" rx="8"/><text class="t" x="340" y="67" text-anchor="middle">Registry.search(source, query, opts)</text></g>
<g class="c-blue"><rect x="245" y="96" width="190" height="32" rx="8"/><text class="t" x="340" y="116" text-anchor="middle">search_cache.get(key)</text></g>
<g class="c-gray"><rect x="470" y="96" width="178" height="32" rx="8" stroke-dasharray="5 4"/><text class="ts" x="559" y="116" text-anchor="middle">hit → return cached</text></g>
<g class="c-gray"><rect x="200" y="160" width="280" height="36" rx="8"/><text class="t" x="340" y="183" text-anchor="middle">_ensure_initialized → source.search()</text></g>

<g class="c-gray"><rect x="30" y="222" width="626" height="160" rx="10"/><text class="ts" x="340" y="240" text-anchor="middle">source.search() · dispatch by source key (one runs per action)</text></g>

<g class="c-teal"><rect x="42" y="250" width="196" height="56" rx="8"/><text class="t" x="140" y="270" text-anchor="middle">github_code</text><text class="ts" x="140" y="286" text-anchor="middle">GET /search/code</text><text class="ts" x="140" y="300" text-anchor="middle">q verbatim + qualifiers</text></g>
<g class="c-teal"><rect x="248" y="250" width="196" height="56" rx="8"/><text class="t" x="346" y="270" text-anchor="middle">github_issues</text><text class="ts" x="346" y="286" text-anchor="middle">GET /search/issues</text><text class="ts" x="346" y="300" text-anchor="middle">q verbatim</text></g>
<g class="c-teal"><rect x="454" y="250" width="196" height="56" rx="8"/><text class="t" x="552" y="270" text-anchor="middle">slack</text><text class="ts" x="552" y="286" text-anchor="middle">GET /search.messages</text><text class="ts" x="552" y="300" text-anchor="middle">in: from: before: has:</text></g>

<g class="c-teal"><rect x="42" y="316" width="196" height="56" rx="8"/><text class="t" x="140" y="336" text-anchor="middle">confluence</text><text class="ts" x="140" y="352" text-anchor="middle">_to_cql → CQL</text><text class="ts" x="140" y="366" text-anchor="middle">text ~ "…" | verbatim</text></g>
<g class="c-teal"><rect x="248" y="316" width="196" height="56" rx="8"/><text class="t" x="346" y="336" text-anchor="middle">jira</text><text class="ts" x="346" y="352" text-anchor="middle">_to_jql → JQL</text><text class="ts" x="346" y="366" text-anchor="middle">text ~ "…" | verbatim</text></g>
<g class="c-teal"><rect x="454" y="316" width="196" height="56" rx="8"/><text class="t" x="552" y="336" text-anchor="middle">drive</text><text class="ts" x="552" y="352" text-anchor="middle">_build_query → q=</text><text class="ts" x="552" y="366" text-anchor="middle">fullText contains '…'</text></g>

<g class="c-gray"><rect x="200" y="398" width="280" height="34" rx="8"/><text class="t" x="340" y="420" text-anchor="middle">map payload → list[Result]</text></g>
<g class="c-blue"><rect x="200" y="452" width="280" height="34" rx="8"/><text class="t" x="340" y="474" text-anchor="middle">search_cache.set(key, results, ttl 6h)</text></g>
<g class="c-gray"><rect x="255" y="506" width="170" height="32" rx="8"/><text class="t" x="340" y="526" text-anchor="middle">→ list[Result]</text></g>
</svg>