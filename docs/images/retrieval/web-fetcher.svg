<svg width="680" height="520" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>WebFetcher.fetch three-tier recovery ladder</title>
<desc>WebFetcher.fetch normalizes the URL and checks the scrape cache, then tries three tiers in order: browser render, recover-and-retry the browser session, and an httpx fallback with tenacity retries. Each tier falls through to the next on exception, and any success jumps to the shared path that truncates content, writes the scrape cache, emits an event, and returns.</desc>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888780"/></marker>
<marker id="ahR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#E24B4A"/></marker>
<marker id="ahG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#639922"/></marker>
</defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5;marker-end:url(#arrow)}
.box{fill:#FBFAF7;stroke:#888780;stroke-width:0.6}
.node{cursor:pointer}
.leader{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:2 2}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.6}
.c-gray .t,.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.6}
.c-purple .t,.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.6}
.c-teal .t,.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.6}
.c-amber .t,.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse{fill:#FAECE7;stroke:#993C1D;stroke-width:0.6}
.c-coral .t,.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-green>rect,.c-green>circle,.c-green>ellipse{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.6}
.c-green .t,.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-blue>rect,.c-blue>circle,.c-blue>ellipse{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.6}
.c-blue .t,.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-red>rect,.c-red>circle,.c-red>ellipse{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.6}
.c-red .t,.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
.c-pink>rect,.c-pink>circle,.c-pink>ellipse{fill:#FBEAF0;stroke:#993556;stroke-width:0.6}
.c-pink .t,.c-pink .th{fill:#72243E}.c-pink .ts{fill:#993556}
</style>
<rect x="0" y="0" width="680" height="520" fill="#ffffff"/>

<line x1="340" y1="74" x2="340" y2="88" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="470" y1="104" x2="500" y2="104" stroke="#888780" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<line x1="185" y1="126" x2="185" y2="150" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>

<line x1="185" y1="214" x2="185" y2="246" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahR)"/>
<line x1="185" y1="310" x2="185" y2="342" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahR)"/>

<line x1="330" y1="181" x2="470" y2="181" stroke="#639922" stroke-width="1.5" marker-end="url(#ahG)"/>
<line x1="330" y1="277" x2="470" y2="277" stroke="#639922" stroke-width="1.5" marker-end="url(#ahG)"/>
<line x1="330" y1="373" x2="470" y2="373" stroke="#639922" stroke-width="1.5"/>
<polyline points="470,373 524,373 524,430" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#ahG)"/>

<text class="ts" x="205" y="234" text-anchor="start">except → browser_crashed</text>
<text class="ts" x="205" y="330" text-anchor="start">except → recovery failed</text>
<text class="ts" x="486" y="168" text-anchor="middle">success (any tier)</text>

<g class="c-gray"><rect x="200" y="40" width="280" height="34" rx="8"/><text class="t" x="340" y="62" text-anchor="middle">WebFetcher.fetch(url)</text></g>
<g class="c-blue"><rect x="210" y="88" width="260" height="32" rx="8"/><text class="t" x="340" y="108" text-anchor="middle">normalize_url → scrape_cache.get</text></g>
<g class="c-gray"><rect x="500" y="88" width="148" height="32" rx="8" stroke-dasharray="5 4"/><text class="ts" x="574" y="108" text-anchor="middle">cache hit → return</text></g>

<g class="c-coral"><rect x="40" y="150" width="290" height="64" rx="8"/><text class="t" x="185" y="170" text-anchor="middle">1 · _fetch_via_browser</text><text class="ts" x="185" y="188" text-anchor="middle">new_tab → attach_page_listener</text><text class="ts" x="185" y="204" text-anchor="middle">goto(networkidle, 30s) → innerText</text></g>
<g class="c-amber"><rect x="40" y="246" width="290" height="64" rx="8"/><text class="t" x="185" y="266" text-anchor="middle">2 · _recover_and_retry</text><text class="ts" x="185" y="284" text-anchor="middle">session.stop() → session.start()</text><text class="ts" x="185" y="300" text-anchor="middle">retry _fetch_via_browser</text></g>
<g class="c-blue"><rect x="40" y="342" width="290" height="64" rx="8"/><text class="t" x="185" y="362" text-anchor="middle">3 · _fetch_via_httpx (fallback)</text><text class="ts" x="185" y="380" text-anchor="middle">tenacity: 3 attempts · wait 1s</text><text class="ts" x="185" y="396" text-anchor="middle">httpx.get → raise_for_status → text</text></g>

<g class="c-green"><rect x="400" y="214" width="248" height="96" rx="8"/><text class="t" x="524" y="236" text-anchor="middle">on success (any tier)</text><text class="ts" x="524" y="256" text-anchor="middle">content[:MAX_CONTENT_CHARS]</text><text class="ts" x="524" y="272" text-anchor="middle">(200k cap)</text><text class="ts" x="524" y="292" text-anchor="middle">scrape_cache.set(ttl 24h)</text></g>

<g class="c-green"><rect x="400" y="430" width="248" height="56" rx="8"/><text class="t" x="524" y="452" text-anchor="middle">emit scrape_complete</text><text class="ts" x="524" y="470" text-anchor="middle">→ return str (page text)</text></g>
</svg>