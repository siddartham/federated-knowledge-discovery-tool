<svg width="680" height="640" viewBox="0 0 680 640" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Columbo call sequence from question to answer, including semantic tool routing</title>
<desc>A UML-style sequence diagram with five lifelines: CLI/UI, loop.run orchestrator, Claude, sources/web, and MCP tools. Time flows downward. Inside the loop frame the orchestrator lists MCP tools, asks Claude to route to the top-K, then plans, executes a parallel fan-out, scores and restitches before the confidence gate; synthesis runs once on exit. Solid arrows are calls, dashed arrows are returns.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5;marker-end:url(#arrow)}
.box{fill:#FBFAF7;stroke:#888780;stroke-width:0.6}
.node{cursor:pointer}
.leader{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:2 2}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.6}
.c-gray .t,.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.6}
.c-purple .t,.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.6}
.c-teal .t,.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.6}
.c-amber .t,.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse{fill:#FAECE7;stroke:#993C1D;stroke-width:0.6}
.c-coral .t,.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-green>rect,.c-green>circle,.c-green>ellipse{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.6}
.c-green .t,.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-blue>rect,.c-blue>circle,.c-blue>ellipse{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.6}
.c-blue .t,.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-red>rect,.c-red>circle,.c-red>ellipse{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.6}
.c-red .t,.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
.c-pink>rect,.c-pink>circle,.c-pink>ellipse{fill:#FBEAF0;stroke:#993556;stroke-width:0.6}
.c-pink .t,.c-pink .th{fill:#72243E}.c-pink .ts{fill:#993556}
</style>
<rect x="0" y="0" width="680" height="640" fill="#ffffff"/>

<line x1="44" y1="22" x2="66" y2="22" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="72" y="26">call</text>
<line x1="118" y1="22" x2="140" y2="22" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="146" y="26">return</text>
<text class="ts" x="228" y="26">purple = Claude · teal = retrieval</text>

<g class="c-gray"><rect x="48" y="44" width="104" height="38" rx="6"/><text class="th" x="100" y="61" text-anchor="middle">CLI / UI</text><text class="ts" x="100" y="75" text-anchor="middle">caller</text></g>
<g class="c-gray"><rect x="168" y="44" width="104" height="38" rx="6"/><text class="th" x="220" y="61" text-anchor="middle">loop.run</text><text class="ts" x="220" y="75" text-anchor="middle">driver</text></g>
<g class="c-purple"><rect x="288" y="44" width="104" height="38" rx="6"/><text class="th" x="340" y="61" text-anchor="middle">Claude</text><text class="ts" x="340" y="75" text-anchor="middle">3 tiers</text></g>
<g class="c-teal"><rect x="408" y="44" width="104" height="38" rx="6"/><text class="th" x="460" y="61" text-anchor="middle">sources / web</text><text class="ts" x="460" y="75" text-anchor="middle">search+scrape</text></g>
<g class="c-teal"><rect x="528" y="44" width="104" height="38" rx="6"/><text class="th" x="580" y="61" text-anchor="middle">MCP tools</text><text class="ts" x="580" y="75" text-anchor="middle">tool_calls</text></g>

<line x1="100" y1="82" x2="100" y2="628" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="220" y1="82" x2="220" y2="628" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="340" y1="82" x2="340" y2="628" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="460" y1="82" x2="460" y2="628" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="580" y1="82" x2="580" y2="628" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>

<text class="ts" x="160" y="99" text-anchor="middle">run(question)</text>
<line x1="100" y1="104" x2="220" y2="104" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<path d="M220 116 h26 v12 h-26" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="252" y="124">expand acronyms</text>

<rect x="150" y="148" width="472" height="396" rx="4" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 3"/>
<rect x="150" y="148" width="140" height="18" rx="0" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="158" y="161">loop · until confident</text>

<text class="ts" x="400" y="171" text-anchor="middle">list_tools (opt)</text>
<line x1="220" y1="176" x2="580" y2="176" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="400" y="193" text-anchor="middle">tool catalog</text>
<line x1="580" y1="198" x2="220" y2="198" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<text class="ts" x="280" y="217" text-anchor="middle">route · Haiku</text>
<line x1="220" y1="222" x2="340" y2="222" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="280" y="239" text-anchor="middle">top-K tools</text>
<line x1="340" y1="244" x2="220" y2="244" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<text class="ts" x="280" y="263" text-anchor="middle">_plan · Sonnet</text>
<line x1="220" y1="268" x2="340" y2="268" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="280" y="285" text-anchor="middle">Actions + confidence</text>
<line x1="340" y1="290" x2="220" y2="290" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<rect x="178" y="306" width="432" height="112" rx="4" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 3"/>
<rect x="178" y="306" width="150" height="18" rx="0" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="186" y="319">par · execute (asyncio)</text>

<text class="ts" x="340" y="331" text-anchor="middle">search · lookup · scrape</text>
<line x1="220" y1="336" x2="460" y2="336" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="400" y="355" text-anchor="middle">call_tool(args)</text>
<line x1="220" y1="360" x2="580" y2="360" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="379" text-anchor="middle">results → batches</text>
<line x1="460" y1="384" x2="220" y2="384" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="400" y="399" text-anchor="middle">tool results</text>
<line x1="580" y1="404" x2="220" y2="404" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<text class="ts" x="280" y="431" text-anchor="middle">score · Haiku</text>
<line x1="220" y1="436" x2="340" y2="436" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="280" y="453" text-anchor="middle">ScoreResult[ ]</text>
<line x1="340" y1="458" x2="220" y2="458" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<text class="ts" x="280" y="475" text-anchor="middle">restitch · Haiku</text>
<line x1="220" y1="480" x2="340" y2="480" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="280" y="497" text-anchor="middle">running summary</text>
<line x1="340" y1="502" x2="220" y2="502" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<path d="M220 514 h26 v12 h-26" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="252" y="522">confidence gate ↺</text>

<text class="ts" x="280" y="561" text-anchor="middle">synthesize · Opus</text>
<line x1="220" y1="566" x2="340" y2="566" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="280" y="583" text-anchor="middle">cited answer</text>
<line x1="340" y1="588" x2="220" y2="588" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<text class="ts" x="160" y="605" text-anchor="middle">answer</text>
<line x1="220" y1="610" x2="100" y2="610" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>