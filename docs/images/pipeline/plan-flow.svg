<svg width="680" height="582" viewBox="0 0 680 582" role="img" xmlns="http://www.w3.org/2000/svg">
<title>ClaudeClient.generate two-layer cache and parse-validate path</title>
<desc>A stage caller renders a prompt and calls ClaudeClient.generate, which hashes model plus prompts into a key and checks the on-disk response cache; a hit returns a cached response with zero tokens, a miss calls the Anthropic API with an ephemeral system-block cache, writes the permanent response cache, records cost, then extract_json recovers the JSON and Pydantic validates it into the stage's model.</desc>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888780"/></marker>
<marker id="ahG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#639922"/></marker>
</defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
