<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 240" role="img">
<title>Follow one question through the funnel: gather wide, score hard, answer narrow</title>
<desc>One question fans out into many retrieved results, a scoring stage keeps only what clears the bar, and a few high-value pieces of evidence become one cited answer.</desc>
<defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.6}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.6}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.6}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-green>rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:.6}.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
</style>
<rect x="0" y="0" width="680" height="240" fill="#ffffff"/>

<g class="c-gray"><rect x="16" y="90" width="96" height="48" rx="6"/><text class="th" x="64" y="112" text-anchor="middle">1 question</text><text class="ts" x="64" y="128" text-anchor="middle">the input</text></g>
<g class="c-teal"><rect x="150" y="64" width="150" height="100" rx="6"/><text class="th" x="225" y="98" text-anchor="middle">gather wide</text><text class="ts" x="225" y="118" text-anchor="middle">N results, in parallel</text><text class="ts" x="225" y="136" text-anchor="middle">search · scrape · tool</text></g>
<g class="c-purple"><rect x="338" y="76" width="140" height="76" rx="6"/><text class="th" x="408" y="106" text-anchor="middle">score hard</text><text class="ts" x="408" y="126" text-anchor="middle">0–13; keep what</text><text class="ts" x="408" y="142" text-anchor="middle">clears the bar</text></g>
<g class="c-green"><rect x="516" y="90" width="150" height="48" rx="6"/><text class="th" x="591" y="112" text-anchor="middle">answer narrow</text><text class="ts" x="591" y="128" text-anchor="middle">few, cited</text></g>

<line class="arr" x1="112" y1="114" x2="150" y2="114"/>
<line class="arr" x1="300" y1="114" x2="338" y2="114"/>
<line class="arr" x1="478" y1="114" x2="516" y2="114"/>

<text class="ts" x="340" y="196" text-anchor="middle">the shape of every run: gather everything → discard most of it → cite the little that answers the question</text>
</svg>
