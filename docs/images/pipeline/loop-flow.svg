<svg xmlns="http://www.w3.org/2000/svg" width="620" height="540" viewBox="0 0 620 540" role="img" aria-label="Columbo loop: route, plan, execute, score, synthesize">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="620" height="540" fill="#ffffff"/>
  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <text x="310" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Columbo loop — route → plan → execute → score → synthesize</text>

    <rect x="210" y="44" width="200" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
    <text x="310" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#444441">question</text>

    <rect x="180" y="98" width="260" height="46" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
    <text x="310" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Route · Haiku</text>
    <text x="310" y="137" text-anchor="middle" font-size="11" fill="#534AB7">select tools · only when MCP is wired</text>

    <rect x="180" y="170" width="260" height="46" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
    <text x="310" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Plan · Sonnet</text>
    <text x="310" y="209" text-anchor="middle" font-size="11" fill="#534AB7">emit actions + 4-dim confidence</text>

    <rect x="180" y="242" width="260" height="46" rx="6" fill="#E1F5EE" stroke="#5DCAA5"/>
    <text x="310" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Execute · asyncio.gather</text>
    <text x="310" y="281" text-anchor="middle" font-size="11" fill="#0F6E56">search · scrape · lookup · tool (parallel)</text>

    <rect x="180" y="314" width="260" height="46" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
    <text x="310" y="336" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Score / Restitch · Haiku</text>
    <text x="310" y="353" text-anchor="middle" font-size="11" fill="#534AB7">0–13 per result → evidence</text>

    <rect x="180" y="404" width="260" height="46" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
    <text x="310" y="426" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Synthesize · Opus</text>
    <text x="310" y="443" text-anchor="middle" font-size="11" fill="#534AB7">single cited answer, on exit</text>

    <rect x="210" y="478" width="200" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
    <text x="310" y="500" text-anchor="middle" font-size="13" font-weight="600" fill="#444441">answer</text>

    <line x1="310" y1="78" x2="310" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="310" y1="144" x2="310" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="310" y1="216" x2="310" y2="242" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="310" y1="288" x2="310" y2="314" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="310" y1="360" x2="310" y2="404" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="328" y="386" font-size="11" fill="#3B6D11">confidence ≥ 0.8 ✓</text>
    <line x1="310" y1="450" x2="310" y2="478" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>

    <path d="M180 337 H150 V193 H180" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
    <text x="142" y="265" transform="rotate(-90 142 265)" text-anchor="middle" font-size="11" fill="#A32D2D">confidence &lt; 0.8 ↺ re-plan</text>
  </g>
</svg>
