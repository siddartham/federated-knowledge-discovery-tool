<svg xmlns="http://www.w3.org/2000/svg" width="620" height="490" viewBox="0 0 620 490" role="img" aria-label="Columbo tool flow: plan's toolset fanning out to scored evidence">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="620" height="490" fill="#ffffff"/>
  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <text x="310" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Columbo tool flow — the planner's toolset and the fan-out to scored evidence</text>

    <rect x="250" y="38" width="120" height="28" rx="6" fill="#F1EFE8" stroke="#B4B2A9"/>
    <text x="310" y="57" text-anchor="middle" font-size="12" font-weight="600" fill="#444441">question</text>

    <rect x="225" y="82" width="170" height="42" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
    <text x="310" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">Route · Haiku</text>
    <text x="310" y="118" text-anchor="middle" font-size="10" fill="#534AB7">opt · MCP tool select</text>

    <rect x="225" y="142" width="170" height="42" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
    <text x="310" y="163" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">Plan · Sonnet</text>
    <text x="310" y="178" text-anchor="middle" font-size="10" fill="#534AB7">emits actions each round</text>

    <line x1="310" y1="66" x2="310" y2="82" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="310" y1="124" x2="310" y2="142" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="402" y="138" font-size="10" fill="#5F5E5A">top-K tools → plan prompt</text>

    <rect x="20" y="222" width="132" height="52" rx="6" fill="#E1F5EE" stroke="#5DCAA5"/>
    <text x="86" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#085041">search</text>
    <text x="86" y="260" text-anchor="middle" font-size="10" fill="#0F6E56">Registry · 6 sources</text>

    <rect x="168" y="222" width="132" height="52" rx="6" fill="#E1F5EE" stroke="#5DCAA5"/>
    <text x="234" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#085041">lookup</text>
    <text x="234" y="260" text-anchor="middle" font-size="10" fill="#0F6E56">Registry API · exact id</text>

    <rect x="316" y="222" width="132" height="52" rx="6" fill="#FAECE7" stroke="#F0997B"/>
    <text x="382" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#712B13">scrape</text>
    <text x="382" y="260" text-anchor="middle" font-size="10" fill="#993C1D">WebFetcher · SSRF+gate</text>

    <rect x="464" y="222" width="132" height="52" rx="6" fill="#E1F5EE" stroke="#5DCAA5"/>
    <text x="530" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#085041">tool_call</text>
    <text x="530" y="260" text-anchor="middle" font-size="10" fill="#0F6E56">MCP · tool gate</text>

    <line x1="270" y1="184" x2="110" y2="222" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="296" y1="184" x2="240" y2="222" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="324" y1="184" x2="378" y2="222" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="350" y1="184" x2="510" y2="222" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="210" y="314" width="200" height="44" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
    <text x="310" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">Score / Restitch · Haiku</text>
    <text x="310" y="352" text-anchor="middle" font-size="10" fill="#534AB7">0–13 per result → evidence</text>

    <line x1="86" y1="274" x2="250" y2="314" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="234" y1="274" x2="290" y2="314" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="382" y1="274" x2="330" y2="314" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="530" y1="274" x2="370" y2="314" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>

    <path d="M410 336 H606 V103 H395" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
    <text x="614" y="220" transform="rotate(-90 614 220)" text-anchor="middle" font-size="10" fill="#5F5E5A">re-plan ↺</text>

    <rect x="210" y="398" width="200" height="38" rx="6" fill="#F6F5FE" stroke="#AFA9EC"/>
    <text x="310" y="417" text-anchor="middle" font-size="12" font-weight="600" fill="#7F77DD">Synthesize · Opus</text>
    <text x="310" y="430" text-anchor="middle" font-size="10" fill="#7F77DD">reached on exit (confidence cleared)</text>
    <line x1="310" y1="358" x2="310" y2="398" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="326" y="382" font-size="10" fill="#3B6D11">confident</text>

    <text x="40" y="462" font-size="10" fill="#888780">purple = Claude · teal = data / execution · coral = web scrape · gray = control</text>
    <text x="40" y="478" font-size="10" fill="#888780">dictionary / acronym enrichment also runs on the question and each round's new results</text>
  </g>
</svg>
