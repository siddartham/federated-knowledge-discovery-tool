<svg width="680" height="880" viewBox="0 0 680 880" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Detailed Columbo call flow: orchestration spine with per-stage class and method calls</title>
<desc>The left column is the orchestration call spine from cli.main._ask through loop.run, enrich_acronyms, _plan, execute_actions, score/restitch, and _synthesize. Each stage lists the concrete classes and methods it calls on the right. A teal back-edge shows the re-plan loop and a purple edge shows the exit to synthesis, with cross-cutting cache, events, and cost infra at the bottom.</desc>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888780"/></marker>
