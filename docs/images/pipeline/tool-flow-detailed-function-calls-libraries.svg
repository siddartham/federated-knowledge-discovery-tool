<g class="c-gray"><rect x="266" y="280" width="382" height="112" rx="8"/><text class="ts" x="276" y="298" text-anchor="start">tool_provider.list_tools() → select_tools_semantic (ROUTE·Haiku)</text><text class="ts" x="276" y="314" text-anchor="start">State.evidence_summary() · Registry.sources_prompt_block()</text><text class="ts" x="276" y="330" text-anchor="start">render_prompt(orchestrate.j2, **plan_prompt_context)</text><text class="ts" x="276" y="346" text-anchor="start">ClaudeClient.generate(PLAN) [response_cache] · CostTracker</text><text class="ts" x="276" y="362" text-anchor="start">extract_json → OrchestrationResponse.model_validate</text><text class="ts" x="276" y="378" text-anchor="start">→ Confidence(composite) + Actions(search/scrape/lookup/tool_call)</text></g>

<g class="c-gray"><rect x="266" y="396" width="382" height="120" rx="8"/><text class="ts" x="276" y="414" text-anchor="start">_run_actions() — asyncio.gather:</text><text class="ts" x="276" y="430" text-anchor="start">· should_skip_url() · DomainGate.allows(url) · ssrf_reason ✓</text><text class="ts" x="276" y="446" text-anchor="start">· do_search → Registry.search → Source.search [search_cache]</text><text class="ts" x="276" y="462" text-anchor="start">· do_scrape → WebFetcher.fetch → browser/httpx [scrape_cache]</text><text class="ts" x="276" y="478" text-anchor="start">· do_lookup → Registry.lookup → Source.lookup [lookup_cache]</text><text class="ts" x="276" y="494" text-anchor="start">· do_tool_call → tool_provider.call_tool → batch [MCP · gate]</text><text class="ts" x="276" y="510" text-anchor="start">then enrich_acronyms()  # re-scan new results</text></g>

<g class="c-gray"><rect x="266" y="540" width="382" height="88" rx="8"/><text class="ts" x="276" y="558" text-anchor="start">_score_new_evidence() — asyncio.gather:</text><text class="ts" x="276" y="574" text-anchor="start">· score_batch → render_prompt(score.j2) → generate(SCORE)</text><text class="ts" x="276" y="590" text-anchor="start">   → ScoreResult(direct_relevance…) → state.scored_results</text><text class="ts" x="276" y="606" text-anchor="start">· restitch → render_prompt(restitch.j2) → generate(RESTITCH)</text><text class="ts" x="276" y="622" text-anchor="start">   → RestitchResult → state.scored_scrapes</text></g>

<g class="c-gray"><rect x="266" y="660" width="382" height="88" rx="8"/><text class="ts" x="276" y="678" text-anchor="start">select_evidence → _all_candidates_sorted [thresh/guar/budget]</text><text class="ts" x="276" y="694" text-anchor="start">render_prompt(synthesize.j2)</text><text class="ts" x="276" y="710" text-anchor="start">ClaudeClient.generate(SYNTH) [response_cache] · CostTracker</text><text class="ts" x="276" y="726" text-anchor="start">extract_json → SynthesisResponse.model_validate</text><text class="ts" x="276" y="742" text-anchor="start">linkify_citations() · render_sources_footer() → RunResult</text></g>

