<g class="c-gray"><rect x="266" y="44" width="382" height="94" rx="8"/><text class="ts" x="276" y="62" text-anchor="start">CacheStore() · EventEmitter(run.jsonl) · DomainGate.load()</text><text class="ts" x="276" y="78" text-anchor="start">BrowserSession(profile) → WebFetcher(session, cache)</text><text class="ts" x="276" y="94" text-anchor="start">DictionaryClient() · ClaudeClient(cache, emitter)</text><text class="ts" x="276" y="110" text-anchor="start">_build_registry() → Registry.register(×6):</text><text class="ts" x="276" y="126" text-anchor="start">GitHubCode · GitHubIssues · Slack · Confluence · Jira · Drive</text></g>

