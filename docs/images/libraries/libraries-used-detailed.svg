<svg width="680" height="1206" viewBox="0 0 680 1206" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Dossier end-to-end orchestration with the semantic tool-router and the libraries used at each stage</title>
<desc>A top-to-bottom pipeline: entry points, session setup, a repeating loop of acronym detection, semantic tool routing, plan, execute fan-out, score, restitch and a confidence gate, then synthesis, output, and cross-cutting infrastructure. Purple stages are Claude LLM calls, teal are retrieval/execution, gray are control and I/O. Gray pills name the library powering each stage.</desc>
