<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 214" role="img">
<title>Scoring an open-ended answer with no answer key: exact-match fails, human eval is costly, an LLM judge fits</title>
<desc>An open-ended answer has no single correct string, so exact-match is useless; human evaluation is the gold standard but slow and costly; an LLM judge is cheap, reproducible, and reference-free.</desc>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.6}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.6}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.6}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.6}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
</style>
<rect x="0" y="0" width="680" height="214" fill="#ffffff"/>

<text class="th" x="340" y="30" text-anchor="middle">an open-ended answer has no single correct string — so how do you score it?</text>

<g class="c-coral"><rect x="24" y="52" width="204" height="96" rx="8"/><text class="th" x="126" y="80" text-anchor="middle">exact-match / BLEU</text><text class="ts" x="126" y="104" text-anchor="middle">✗ nothing to match against —</text><text class="ts" x="126" y="122" text-anchor="middle">there is no reference string</text></g>
<g class="c-amber"><rect x="238" y="52" width="204" height="96" rx="8"/><text class="th" x="340" y="80" text-anchor="middle">human evaluation</text><text class="ts" x="340" y="104" text-anchor="middle">✓ gold standard, but</text><text class="ts" x="340" y="122" text-anchor="middle">✗ slow · costly · not reproducible</text></g>
<g class="c-teal"><rect x="452" y="52" width="204" height="96" rx="8"/><text class="th" x="554" y="80" text-anchor="middle">LLM-as-judge  ✓</text><text class="ts" x="554" y="104" text-anchor="middle">cheap · reproducible ·</text><text class="ts" x="554" y="122" text-anchor="middle">reference-free (no answer key)</text></g>

<text class="ts" x="340" y="182" text-anchor="middle">Dossier uses an LLM judge — it grades the answer's <tspan font-style="italic">grounding against the retrieved evidence</tspan>, not truth in general,</text>
<text class="ts" x="340" y="200" text-anchor="middle">so it needs no ground-truth answer and doesn't lean on the judge's own (fallible) world knowledge.</text>
</svg>
