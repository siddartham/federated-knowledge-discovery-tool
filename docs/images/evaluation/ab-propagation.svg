<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 250" role="img">
<title>A scoring change is not local: the composite ripples into retrieval and selection, then the answer</title>
<desc>Changing the composite formula changes the plan digest (so what gets searched next) and the evidence selection (so which contexts reach the answer); both flow into the judged final quality.</desc>
<defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.6}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.6}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.6}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-green>rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:.6}.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
</style>
<rect x="0" y="0" width="680" height="250" fill="#ffffff"/>

<g class="c-purple"><rect x="20" y="92" width="140" height="52" rx="8"/><text class="th" x="90" y="114" text-anchor="middle">change the</text><text class="th" x="90" y="132" text-anchor="middle">composite formula</text></g>

<g class="c-amber"><rect x="200" y="36" width="150" height="44" rx="6"/><text class="th" x="275" y="55" text-anchor="middle">plan digest</text><text class="ts" x="275" y="71" text-anchor="middle">"top evidence by score"</text></g>
<g class="c-amber"><rect x="376" y="36" width="160" height="44" rx="6"/><text class="th" x="456" y="55" text-anchor="middle">next searches</text><text class="ts" x="456" y="71" text-anchor="middle">retrieval changes</text></g>

<g class="c-teal"><rect x="200" y="156" width="150" height="44" rx="6"/><text class="th" x="275" y="175" text-anchor="middle">evidence selection</text><text class="ts" x="275" y="191" text-anchor="middle">which contexts</text></g>
<g class="c-teal"><rect x="376" y="156" width="160" height="44" rx="6"/><text class="th" x="456" y="175" text-anchor="middle">the answer</text><text class="ts" x="456" y="191" text-anchor="middle">what Opus writes</text></g>

<g class="c-green"><rect x="562" y="92" width="98" height="52" rx="8"/><text class="th" x="611" y="114" text-anchor="middle">quality</text><text class="ts" x="611" y="132" text-anchor="middle">LLM-judged</text></g>

<line x1="160" y1="108" x2="200" y2="66" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>
<line x1="160" y1="130" x2="200" y2="176" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>
<line x1="350" y1="58" x2="376" y2="58" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>
<line x1="350" y1="178" x2="376" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>
<line x1="536" y1="58" x2="562" y2="104" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>
<line x1="536" y1="178" x2="562" y2="132" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>

<text class="ts" x="368" y="26" text-anchor="middle" fill="#854F0B">the trajectory ripple — changes what's searched next</text>
<text class="ts" x="368" y="222" text-anchor="middle" fill="#0F6E56">the direct effect — changes what's selected</text>
<text class="ts" x="340" y="242" text-anchor="middle">so a scoring tweak can't be A/B'd in isolation — you measure the whole trajectory, not just the ranking</text>
</svg>
