<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 268" role="img">
<title>Three layers of validation: runtime scoring steers, the LLM judge grades, statistical analysis links them</title>
<desc>Runtime scoring steers the loop during the run; the offline LLM judge grades the final answer; statistical analysis checks whether the runtime scores predict the judge's grades.</desc>
<defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.6}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.6}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-blue>rect{fill:#E6F1FB;stroke:#185FA5;stroke-width:.6}.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.6}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
</style>
<rect x="0" y="0" width="680" height="268" fill="#ffffff"/>

<g class="c-purple"><rect x="40" y="26" width="470" height="52" rx="8"/><text class="th" x="60" y="48" text-anchor="start">1 · runtime scoring — steer the loop</text><text class="ts" x="60" y="66" text-anchor="start">Haiku scores each source · Sonnet scores confidence of the whole evidence · cheap, during the run</text></g>
<g class="c-gray"><rect x="524" y="34" width="132" height="36" rx="8"/><text class="ts" x="590" y="50" text-anchor="middle">in the ask loop</text><text class="ts" x="590" y="64" text-anchor="middle">(no extra call)</text></g>

<g class="c-teal"><rect x="40" y="108" width="470" height="52" rx="8"/><text class="th" x="60" y="130" text-anchor="start">2 · LLM-as-judge — grade the output</text><text class="ts" x="60" y="148" text-anchor="start">faithfulness · answer relevancy · context precision, on the final answer · the quality signal</text></g>
<g class="c-gray"><rect x="524" y="116" width="132" height="36" rx="8"/><text class="ts" x="590" y="132" text-anchor="middle">devtools eval</text><text class="ts" x="590" y="146" text-anchor="middle">offline, cached</text></g>

<g class="c-blue"><rect x="40" y="190" width="470" height="52" rx="8"/><text class="th" x="60" y="212" text-anchor="start">3 · statistical analysis — validate the link</text><text class="ts" x="60" y="230" text-anchor="start">does the runtime score predict the judge's grade? correlation · calibration · citation precision</text></g>
<g class="c-gray"><rect x="524" y="198" width="132" height="36" rx="8"/><text class="ts" x="590" y="214" text-anchor="middle">devtools analyze</text><text class="ts" x="590" y="228" text-anchor="middle">reads run logs</text></g>

<line class="arr" x1="275" y1="78" x2="275" y2="108" stroke="#5F5E5A"/>
<line class="arr" x1="275" y1="160" x2="275" y2="190" stroke="#5F5E5A"/>
<text class="ts" x="285" y="98" text-anchor="start">produces the answer</text>
<text class="ts" x="285" y="180" text-anchor="start">joins runtime scores + judge grades by run</text>
</svg>
