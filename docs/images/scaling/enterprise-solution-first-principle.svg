<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 262" role="img">
<title>At 100s of platforms, federate (search in place) instead of centralize (copy into one index)</title>
<desc>Centralizing copies every source into one index which goes stale and flattens permissions; federating queries each source in place, live, under the user's own access.</desc>
<defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.6}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D;stroke-width:.6}.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
.c-green>rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:.6}.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.6}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
</style>
<rect x="0" y="0" width="680" height="262" fill="#ffffff"/>

<text class="th" x="170" y="28" text-anchor="middle" fill="#791F1F">centralize ✗</text>
<g class="c-gray"><rect x="24" y="44" width="70" height="22" rx="6"/><text class="ts" x="59" y="59" text-anchor="middle">source</text></g>
<g class="c-gray"><rect x="24" y="72" width="70" height="22" rx="6"/><text class="ts" x="59" y="87" text-anchor="middle">source</text></g>
<g class="c-gray"><rect x="24" y="100" width="70" height="22" rx="6"/><text class="ts" x="59" y="115" text-anchor="middle">×100s</text></g>
<g class="c-red"><rect x="150" y="58" width="150" height="50" rx="6"/><text class="th" x="225" y="80" text-anchor="middle">one big index</text><text class="ts" x="225" y="98" text-anchor="middle">copy everything in</text></g>
<line class="arr" x1="94" y1="55" x2="150" y2="76"/>
<line class="arr" x1="94" y1="83" x2="150" y2="83"/>
<line class="arr" x1="94" y1="111" x2="150" y2="90"/>
<text class="ts" x="170" y="132" text-anchor="middle" fill="#A32D2D">stale · RBAC flattened · never finishes</text>

<text class="th" x="510" y="28" text-anchor="middle" fill="#27500A">federate ✓</text>
<g class="c-teal"><rect x="404" y="60" width="120" height="46" rx="6"/><text class="th" x="464" y="82" text-anchor="middle">the agent</text><text class="ts" x="464" y="100" text-anchor="middle">queries in place</text></g>
<g class="c-green"><rect x="566" y="44" width="90" height="22" rx="6"/><text class="ts" x="611" y="59" text-anchor="middle">source (live)</text></g>
<g class="c-green"><rect x="566" y="72" width="90" height="22" rx="6"/><text class="ts" x="611" y="87" text-anchor="middle">source (live)</text></g>
<g class="c-green"><rect x="566" y="100" width="90" height="22" rx="6"/><text class="ts" x="611" y="115" text-anchor="middle">×100s (live)</text></g>
<line class="arr" x1="524" y1="76" x2="566" y2="55"/>
<line class="arr" x1="524" y1="83" x2="566" y2="83"/>
<line class="arr" x1="524" y1="90" x2="566" y2="111"/>
<text class="ts" x="510" y="132" text-anchor="middle" fill="#3B6D11">fresh · per-user RBAC preserved</text>

<g class="c-gray"><rect x="24" y="160" width="632" height="80" rx="8"/><text class="th" x="340" y="184" text-anchor="middle">don't build a search engine — orchestrate the ones that exist</text><text class="ts" x="340" y="208" text-anchor="middle">searching each source live, under the user's own access, keeps answers fresh and never sees data the user can't.</text><text class="ts" x="340" y="226" text-anchor="middle">The cost is latency and rate limits — which caching and per-source fan-out control.</text></g>
</svg>
