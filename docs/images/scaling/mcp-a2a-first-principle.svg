<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 254" role="img">
<title>MCP is a protocol for tools; A2A is delegation between agents</title>
<desc>MCP gives one standard interface to many tools, removing per-tool glue; A2A lets an agent delegate to other agents, which adds a trust boundary and a loop-termination problem.</desc>
<defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.6}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.6}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.6}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.6}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
</style>
<rect x="0" y="0" width="680" height="254" fill="#ffffff"/>

<text class="th" x="170" y="30" text-anchor="middle" fill="#085041">MCP — a protocol</text>
<line x1="20" y1="40" x2="320" y2="40" stroke="#9FE1CB" stroke-width="1"/>
<g class="c-purple"><rect x="30" y="58" width="90" height="40" rx="6"/><text class="th" x="75" y="83" text-anchor="middle">agent</text></g>
<g class="c-teal"><rect x="140" y="58" width="130" height="40" rx="6"/><text class="ts" x="205" y="76" text-anchor="middle">one standard</text><text class="ts" x="205" y="92" text-anchor="middle">interface</text></g>
<g class="c-gray"><rect x="286" y="46" width="70" height="24" rx="6"/><text class="ts" x="321" y="62" text-anchor="middle">tool</text></g>
<g class="c-gray"><rect x="286" y="74" width="70" height="24" rx="6"/><text class="ts" x="321" y="90" text-anchor="middle">tool</text></g>
<g class="c-gray"><rect x="286" y="102" width="70" height="24" rx="6"/><text class="ts" x="321" y="118" text-anchor="middle">tool ×100</text></g>
<line class="arr" x1="120" y1="78" x2="140" y2="78"/>
<line class="arr" x1="270" y1="78" x2="286" y2="58"/>
<line class="arr" x1="270" y1="82" x2="286" y2="86"/>
<line class="arr" x1="270" y1="86" x2="286" y2="114"/>
<text class="ts" x="170" y="150" text-anchor="middle">win: no bespoke glue per tool</text>

<text class="th" x="510" y="30" text-anchor="middle" fill="#633806">A2A — delegation</text>
<line x1="370" y1="40" x2="660" y2="40" stroke="#FAC775" stroke-width="1"/>
<g class="c-purple"><rect x="386" y="70" width="80" height="40" rx="6"/><text class="th" x="426" y="95" text-anchor="middle">agent</text></g>
<g class="c-purple"><rect x="486" y="70" width="80" height="40" rx="6"/><text class="th" x="526" y="95" text-anchor="middle">agent</text></g>
<g class="c-purple"><rect x="586" y="70" width="70" height="40" rx="6"/><text class="th" x="621" y="95" text-anchor="middle">agent</text></g>
<line class="arr" x1="466" y1="90" x2="486" y2="90"/>
<line class="arr" x1="566" y1="90" x2="586" y2="90"/>
<path d="M621 110 L621 132 L426 132 L426 110" fill="none" stroke="#A32D2D" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arw)"/>
<text class="ts" x="523" y="150" text-anchor="middle" fill="#A32D2D">risk: trust boundary + who stops the loop?</text>

<g class="c-gray"><rect x="20" y="184" width="640" height="52" rx="8"/><text class="ts" x="340" y="206" text-anchor="middle">adopt the one that removes work you'd otherwise hand-roll: MCP standardizes the tool interface (worth it at scale);</text><text class="ts" x="340" y="224" text-anchor="middle">A2A adds power but also a termination + trust problem you now own.</text></g>
</svg>
