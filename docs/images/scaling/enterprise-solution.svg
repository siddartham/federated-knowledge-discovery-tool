<svg width="680" height="430" viewBox="0 0 680 430" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Enterprise-scale federated Q&amp;A architecture</title>
<desc>A user signs in via SSO to a central governed Q&amp;A agent that does orchestration, audit, DLP, central LLM egress and loop control. Below it four tiers: direct OAuth to horizontal stores like Confluence, Google Docs, Slack, Jira and GitHub; an MCP standard contract each platform team implements once; A2A delegation to platform agents that enforce RBAC at source; and cite-don't-fetch for the long tail. Per-user identity from the Identity Platform and Entitlements ABAC is propagated to every tier.</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#888780"/></marker></defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5;marker-end:url(#arrow)}
.box{fill:#FBFAF7;stroke:#888780;stroke-width:0.6}
.node{cursor:pointer}
.leader{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:2 2}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.6}
.c-gray .t,.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.6}
.c-purple .t,.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.6}
.c-teal .t,.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.6}
.c-amber .t,.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse{fill:#FAECE7;stroke:#993C1D;stroke-width:0.6}
.c-coral .t,.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-green>rect,.c-green>circle,.c-green>ellipse{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.6}
.c-green .t,.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-blue>rect,.c-blue>circle,.c-blue>ellipse{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.6}
.c-blue .t,.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-red>rect,.c-red>circle,.c-red>ellipse{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.6}
.c-red .t,.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
.c-pink>rect,.c-pink>circle,.c-pink>ellipse{fill:#FBEAF0;stroke:#993556;stroke-width:0.6}
.c-pink .t,.c-pink .th{fill:#72243E}.c-pink .ts{fill:#993556}
</style>
<rect x="0" y="0" width="680" height="430" fill="#ffffff"/>
<g class="c-gray"><rect x="270" y="18" width="150" height="26" rx="8"/><text class="ts" x="345" y="35" text-anchor="middle">User · SSO</text></g>
<line x1="345" y1="44" x2="345" y2="58" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<g class="c-gray"><rect x="70" y="58" width="550" height="46" rx="8"/><text class="t" x="345" y="78" text-anchor="middle">Central Q&amp;A agent (governed hub)</text><text class="ts" x="345" y="94" text-anchor="middle">orchestrate · score · synthesize · audit · DLP · central LLM egress · loop control</text></g>

<line x1="345" y1="104" x2="345" y2="118" stroke="#888780" stroke-width="1.2" marker-end="url(#ah)"/>
<g class="c-teal"><rect x="70" y="118" width="550" height="48" rx="8"/><text class="t" x="345" y="138" text-anchor="middle">Tier 1 · direct OAuth / OBO — the horizontal stores (bulk of docs)</text><text class="ts" x="345" y="155" text-anchor="middle">Confluence · Google Docs/Slides · Slack · Jira · GitHub · The Exchange · ServiceNow</text></g>
<g class="c-teal"><rect x="70" y="176" width="550" height="48" rx="8"/><text class="t" x="345" y="196" text-anchor="middle">Tier 2 · MCP standard contract — each platform team exposes 1 docs/search server</text><text class="ts" x="345" y="213" text-anchor="middle">Pulse · OnePipeline · Model Platform · Feature Platform · … (onboard top-N by demand)</text></g>
<g class="c-purple"><rect x="70" y="234" width="550" height="48" rx="8"/><text class="t" x="345" y="254" text-anchor="middle">Tier 3 · A2A — platform's own agent answers, enforces RBAC/ABAC at source</text><text class="ts" x="345" y="271" text-anchor="middle">deepest / most-sensitive platforms · via Entitlements + Cerberus</text></g>
<g class="c-amber"><rect x="70" y="292" width="550" height="48" rx="8"/><text class="t" x="345" y="312" text-anchor="middle">Tier 4 · cite-don't-fetch — the long tail (safe default)</text><text class="ts" x="345" y="329" text-anchor="middle">nothing fetched · onboarding backlog, ranked by query volume</text></g>

<g class="c-blue"><rect x="18" y="118" width="44" height="222" rx="8"/><text class="ts" transform="rotate(-90 40 229)" x="40" y="229" text-anchor="middle">per-user identity → every tier (Identity Platform + Entitlements ABAC)</text></g>

<text class="ts" x="18" y="366" text-anchor="start">Integration cost DISTRIBUTES to platform owners (Tiers 2–3); the hub writes ONE client per standard.</text>
<text class="ts" x="18" y="384" text-anchor="start">RBAC/ABAC enforced as the user everywhere: OBO tokens (T1–2) · A2A auth (T3) · ACL-trim if indexed.</text>
<text class="ts" x="18" y="402" text-anchor="start">Ship value from Tier 1 on day one; Tiers 2–4 grow over time. Never a big-bang integration of hundreds.</text>
</svg>