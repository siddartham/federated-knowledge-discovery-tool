<svg width="680" height="312" viewBox="0 0 680 312" role="img" xmlns="http://www.w3.org/2000/svg">
<title>MCP versus A2A for the Q&amp;A agent</title>
<desc>The Q&amp;A agent connects downward via MCP to tool and data servers like Slack, Confluence and GitHub where it fetches data and still needs a per-user token, and sideways via A2A to peer platform agents like Governance, Model and OnePipeline which answer about their own data as the user with RBAC enforced inside each platform and return answers and citations rather than raw documents.</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#888780"/></marker></defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5;marker-end:url(#arrow)}
.box{fill:#FBFAF7;stroke:#888780;stroke-width:0.6}
.node{cursor:pointer}
.leader{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:2 2}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.6}
.c-gray .t,.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.6}
.c-purple .t,.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.6}
.c-teal .t,.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.6}
.c-amber .t,.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse{fill:#FAECE7;stroke:#993C1D;stroke-width:0.6}
.c-coral .t,.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-green>rect,.c-green>circle,.c-green>ellipse{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.6}
.c-green .t,.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-blue>rect,.c-blue>circle,.c-blue>ellipse{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.6}
.c-blue .t,.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-red>rect,.c-red>circle,.c-red>ellipse{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.6}
.c-red .t,.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
.c-pink>rect,.c-pink>circle,.c-pink>ellipse{fill:#FBEAF0;stroke:#993556;stroke-width:0.6}
.c-pink .t,.c-pink .th{fill:#72243E}.c-pink .ts{fill:#993556}
</style>
<rect x="0" y="0" width="680" height="312" fill="#ffffff"/>
<g class="c-gray"><rect x="240" y="34" width="200" height="40" rx="8"/><text class="t" x="340" y="54" text-anchor="middle">Q&amp;A agent (Dossier)</text><text class="ts" x="340" y="68" text-anchor="middle">orchestrate · score · synthesize</text></g>
<line x1="300" y1="74" x2="180" y2="116" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="380" y1="74" x2="500" y2="116" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<g class="c-teal"><rect x="30" y="118" width="300" height="42" rx="8"/><text class="t" x="180" y="138" text-anchor="middle">MCP · agent ↔ tools / data</text><text class="ts" x="180" y="153" text-anchor="middle">YOU fetch the data (still need a per-user token)</text></g>
<g class="c-purple"><rect x="350" y="118" width="300" height="42" rx="8"/><text class="t" x="500" y="138" text-anchor="middle">A2A · agent ↔ agent</text><text class="ts" x="500" y="153" text-anchor="middle">THEY answer, as the user</text></g>
<g class="c-teal"><rect x="34" y="176" width="94" height="30" rx="6"/><text class="ts" x="81" y="195" text-anchor="middle">Slack MCP</text></g>
<g class="c-teal"><rect x="134" y="176" width="94" height="30" rx="6"/><text class="ts" x="181" y="195" text-anchor="middle">Confluence MCP</text></g>
<g class="c-teal"><rect x="234" y="176" width="92" height="30" rx="6"/><text class="ts" x="280" y="195" text-anchor="middle">GitHub MCP</text></g>
<g class="c-purple"><rect x="354" y="176" width="94" height="30" rx="6"/><text class="ts" x="401" y="195" text-anchor="middle">Governance</text></g>
<g class="c-purple"><rect x="454" y="176" width="94" height="30" rx="6"/><text class="ts" x="501" y="195" text-anchor="middle">Model agent</text></g>
<g class="c-purple"><rect x="554" y="176" width="94" height="30" rx="6"/><text class="ts" x="601" y="195" text-anchor="middle">OnePipeline</text></g>
<text class="ts" x="30" y="238" text-anchor="start">MCP: standardizes integration · you still read the raw docs · per-user auth (OBO) still required.</text>
<text class="ts" x="30" y="262" text-anchor="start">A2A: each platform's own agent enforces its RBAC and returns answers + citations, not raw documents.</text>
<text class="ts" x="30" y="286" text-anchor="start">Both carry the user's identity via OAuth — same principle as OBO, just standardized at the boundary.</text>
</svg>