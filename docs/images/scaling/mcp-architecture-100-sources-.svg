<svg width="680" height="300" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Extending Columbo for a 100-tool MCP server via tool retrieval</title>
<desc>The question drives a tool selector that ranks the 100 tool descriptions and returns a shortlist of five to fifteen. Only those tool schemas go into the plan prompt; the planner emits tool_calls; the MCP client invokes them with a per-user OBO token; results normalize to Columbo Result objects and flow into the existing score and synthesize pipeline.</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#888780"/></marker></defs>
<style>
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#2C2C2A}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.5;marker-end:url(#arrow)}
.box{fill:#FBFAF7;stroke:#888780;stroke-width:0.6}
.node{cursor:pointer}
.leader{fill:none;stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:2 2}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.6}
.c-gray .t,.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.6}
.c-purple .t,.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.6}
.c-teal .t,.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.6}
.c-amber .t,.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse{fill:#FAECE7;stroke:#993C1D;stroke-width:0.6}
.c-coral .t,.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-green>rect,.c-green>circle,.c-green>ellipse{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.6}
.c-green .t,.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
.c-blue>rect,.c-blue>circle,.c-blue>ellipse{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.6}
.c-blue .t,.c-blue .th{fill:#0C447C}.c-blue .ts{fill:#185FA5}
.c-red>rect,.c-red>circle,.c-red>ellipse{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.6}
.c-red .t,.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
.c-pink>rect,.c-pink>circle,.c-pink>ellipse{fill:#FBEAF0;stroke:#993556;stroke-width:0.6}
.c-pink .t,.c-pink .th{fill:#72243E}.c-pink .ts{fill:#993556}
</style>
<rect x="0" y="0" width="680" height="300" fill="#ffffff"/>
<g class="c-gray"><rect x="20" y="40" width="120" height="40" rx="8"/><text class="t" x="80" y="60" text-anchor="middle">question</text></g>
<line x1="140" y1="60" x2="168" y2="60" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<g class="c-teal"><rect x="170" y="34" width="170" height="52" rx="8"/><text class="t" x="255" y="54" text-anchor="middle">tool selector</text><text class="ts" x="255" y="70" text-anchor="middle">rank 100 → top K (5–15)</text></g>
<line x1="340" y1="60" x2="368" y2="60" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<g class="c-purple"><rect x="370" y="34" width="160" height="52" rx="8"/><text class="t" x="450" y="54" text-anchor="middle">plan · Sonnet</text><text class="ts" x="450" y="70" text-anchor="middle">only K tool schemas</text></g>
<line x1="450" y1="86" x2="450" y2="112" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<g class="c-purple"><rect x="350" y="112" width="200" height="40" rx="8"/><text class="ts" x="450" y="132" text-anchor="middle">emits tool_calls</text><text class="ts" x="450" y="146" text-anchor="middle">{name, arguments} per schema</text></g>
<line x1="450" y1="152" x2="450" y2="176" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<g class="c-coral"><rect x="330" y="176" width="240" height="46" rx="8"/><text class="t" x="450" y="196" text-anchor="middle">MCP client · call_tool()</text><text class="ts" x="450" y="211" text-anchor="middle">per-user bearer token on each call</text></g>
<line x1="330" y1="199" x2="250" y2="199" stroke="#888780" stroke-width="1.4" marker-end="url(#ah)"/>
<g class="c-teal"><rect x="60" y="176" width="190" height="46" rx="8"/><text class="t" x="155" y="196" text-anchor="middle">normalize → Result[]</text><text class="ts" x="155" y="211" text-anchor="middle">then score → synthesize</text></g>
<line x1="155" y1="176" x2="155" y2="90" stroke="#1D9E75" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text class="ts" x="20" y="250" text-anchor="start">Now built: select_tools_semantic (route · Haiku) + MCPToolProvider; the plan → score → synthesize loop, caching, and cost caps are unchanged.</text>
<text class="ts" x="20" y="268" text-anchor="start">MCP results become ordinary evidence — the scorer/synthesizer never learn they came from a tool.</text>
</svg>