[project]
name = "columbo-py"
version = "0.1.0"
description = "Multi-source enterprise knowledge agent: search, scrape, score, and synthesize a cited answer using Claude."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.34",
    "pydantic>=2.7",
    "httpx>=0.27",
    "playwright>=1.45",
    "diskcache>=5.6",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "structlog>=24.1",
    "tenacity>=8.3",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
ui = [
    "chainlit>=1.1",
]
desktop = [
    "chainlit>=1.1",
    "pywebview>=5.0",
]
mcp = [
    "mcp>=1.0",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.scripts]
columbo = "columbo_py.cli.main:app"

[tool.setuptools.packages.find]
include = ["columbo_py*"]

# Non-Python files loaded at runtime via __file__ (prompt templates and the
# per-source LLM guidance) must ship in the wheel, not just the source tree.
[tool.setuptools.package-data]
"columbo_py.config" = ["*.toml"]
"columbo_py.evals" = ["*.jsonl"]
"columbo_py.engine.prompts" = ["templates/*.j2"]
"columbo_py.sources.github" = ["*.md"]
"columbo_py.sources.slack" = ["*.md"]
"columbo_py.sources.confluence" = ["*.md"]
"columbo_py.sources.jira" = ["*.md"]
"columbo_py.sources.drive" = ["*.md"]
"columbo_py.sources.mcp" = ["*.md"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
# Matches the dev/CI interpreter (3.12). 3.11-syntax compatibility (the project's
# requires-python floor) is enforced by ruff's target-version = "py311" instead;
# pinning mypy to 3.11 here only broke on incidental deps' 3.12-syntax stubs
# (numpy via pandas) that we never import.
python_version = "3.12"
strict = true

# Third-party deps that ship no type stubs / py.typed marker. Under strict
# mode these otherwise surface as import-untyped errors on every run.
[[tool.mypy.overrides]]
module = ["diskcache.*", "google_auth_oauthlib.*", "chainlit.*", "webview.*", "mcp.*"]
ignore_missing_imports = true

# The Chainlit entrypoint decorates handlers with Chainlit's (untyped-to-us)
# decorators; that's inherent to the framework and only affects this one shim.
[[tool.mypy.overrides]]
module = "columbo_py.ui.app"
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["columbo_py/tests"]
